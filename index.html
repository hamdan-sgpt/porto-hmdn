    <style>
      #boot-screen {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        background: #040406;
        z-index: 999999;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 36px 48px;
        box-sizing: border-box;
        font-family: 'JetBrains Mono', monospace, sans-serif;
        color: #e4e4e7;
        overflow: hidden;
        user-select: none;
        transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), filter 0.6s ease;
      }

      #boot-screen.boot-exit {
        opacity: 0;
        transform: scale(1.04);
        filter: blur(14px);
        pointer-events: none;
      }

      .boot-grid-bg {
        position: absolute;
        inset: 0;
        background-image: 
          linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
        background-size: 50px 50px;
        pointer-events: none;
      }

      .boot-glow {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 550px;
        height: 550px;
        background: radial-gradient(circle, rgba(0, 220, 130, 0.13) 0%, rgba(54, 228, 218, 0.04) 40%, transparent 70%);
        filter: blur(70px);
        pointer-events: none;
        animation: glowPulse 3s infinite ease-in-out;
      }

      @keyframes glowPulse {
        0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(0.95); }
        50% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
      }

      .boot-topbar, .boot-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 11px;
        letter-spacing: 0.15em;
        color: #71717a;
        z-index: 2;
        text-transform: uppercase;
      }

      .boot-tag {
        display: flex;
        align-items: center;
        gap: 10px;
        color: #a1a1aa;
        font-weight: 500;
      }

      .boot-dot {
        width: 6px;
        height: 6px;
        background: #00dc82;
        border-radius: 50%;
        box-shadow: 0 0 10px #00dc82;
        animation: dotBlink 1.2s infinite ease-in-out;
      }

      @keyframes dotBlink {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; }
      }

      .boot-center {
        position: relative;
        z-index: 2;
        margin: auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        max-width: 440px;
        width: 100%;
      }

      .boot-logo-wrapper {
        width: 96px;
        height: 96px;
        margin-bottom: 24px;
        position: relative;
      }

      .boot-svg-logo {
        width: 100%;
        height: 100%;
        filter: drop-shadow(0 0 20px rgba(0, 220, 130, 0.45));
      }

      .boot-ring-active {
        transition: stroke-dashoffset 0.08s linear;
      }

      .boot-dot-pulse {
        animation: dotPulse 1.5s infinite ease-in-out;
      }

      @keyframes dotPulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.3); opacity: 0.6; }
      }

      .boot-counter-wrap {
        font-size: 64px;
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.04em;
        color: #ffffff;
        margin-bottom: 8px;
        background: linear-gradient(180deg, #ffffff 30%, #a1a1aa 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .boot-percent-symbol {
        font-size: 26px;
        font-weight: 600;
        color: #00dc82;
        margin-left: 2px;
        -webkit-text-fill-color: #00dc82;
      }

      .boot-subtitle {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.28em;
        color: #a1a1aa;
        margin-bottom: 32px;
        text-transform: uppercase;
      }

      .boot-divider {
        color: #00dc82;
        margin: 0 6px;
      }

      .boot-progress-track {
        width: 100%;
        height: 2px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 99px;
        overflow: hidden;
        margin-bottom: 16px;
        position: relative;
      }

      .boot-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #00dc82, #36e4da, #00dc82);
        box-shadow: 0 0 16px rgba(0, 220, 130, 0.85);
        transition: width 0.08s linear;
      }

      .boot-status-text {
        font-size: 11px;
        letter-spacing: 0.14em;
        color: #36e4da;
        font-weight: 500;
        height: 16px;
      }

      @media (max-width: 640px) {
        #boot-screen {
          padding: 24px 24px;
        }
        .boot-counter-wrap {
          font-size: 48px;
        }
        .boot-subtitle {
          font-size: 10px;
          letter-spacing: 0.2em;
        }
      }
    </style>

  <body>
    <!-- ULTRA-SLEEK BOOT SCREEN -->
    <div id="boot-screen">
      <div class="boot-grid-bg"></div>
      <div class="boot-glow"></div>
      
      <!-- Top Telemetry Header -->
      <div class="boot-topbar">
        <div class="boot-tag">
          <span class="boot-dot"></span>
          <span>HAMS.OS_V2.4</span>
        </div>
        <div class="boot-coords">SYS_PORT 8080 // LATENCY 4ms</div>
      </div>

      <!-- Center Content -->
      <div class="boot-center">
        <div class="boot-logo-wrapper">
          <svg class="boot-svg-logo" viewBox="0 0 100 100" fill="none">
            <circle class="boot-ring-bg" cx="50" cy="50" r="42" stroke="rgba(255,255,255,0.06)" stroke-width="2" />
            <circle class="boot-ring-active" id="boot-svg-ring" cx="50" cy="50" r="42" stroke="url(#bootGradient)" stroke-width="2.5" stroke-dasharray="264" stroke-dashoffset="264" />
            <g transform="translate(10, 0)">
              <path d="M 26 25 V 70 M 26 45 C 26 36, 46 36, 46 45 V 70" stroke="url(#bootGradient)" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" />
              <circle cx="58.5" cy="67" r="4.5" fill="#00dc82" class="boot-dot-pulse" />
            </g>
            <defs>
              <linearGradient id="bootGradient" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#00dc82" />
                <stop offset="100%" stop-color="#36e4da" />
              </linearGradient>
            </defs>
          </svg>
        </div>

        <div class="boot-counter-wrap">
          <span id="boot-num">00</span><span class="boot-percent-symbol">%</span>
        </div>

        <div class="boot-subtitle">HAMDAN <span class="boot-divider">/</span> CREATIVE DEVELOPER</div>

        <div class="boot-progress-track">
          <div class="boot-progress-bar" id="boot-bar"></div>
        </div>

        <div class="boot-status-text" id="boot-status">INITIALIZING SYSTEM ENVIRONMENT...</div>
      </div>

      <!-- Bottom Diagnostics Footer -->
      <div class="boot-footer">
        <div>SYS_STATUS: <span style="color:#00dc82;">OPTIMAL</span></div>
        <div>INDONESIA (GMT+7)</div>
      </div>
    </div>

    <div id="root"></div>

    <script>
      (function() {
        var bootScreen = document.getElementById('boot-screen');
        var bootBar = document.getElementById('boot-bar');
        var bootNum = document.getElementById('boot-num');
        var bootStatus = document.getElementById('boot-status');
        var bootRing = document.getElementById('boot-svg-ring');

        if (!bootScreen) return;

        var logs = [
          "INITIALIZING SYSTEM ENVIRONMENT...",
          "LOADING GRAPHICS ENGINE...",
          "SYNCHRONIZING PORTFOLIO MODULES...",
          "ACCESS GRANTED // WELCOME"
        ];

        var maxOffset = 264;
        var startTime = performance.now();
        var duration = 1400; // 1.4s ultra-smooth animation

        function updateBoot(now) {
          var elapsed = now - startTime;
          var progressRatio = Math.min(elapsed / duration, 1);
          var progress = Math.floor(progressRatio * 100);

          if (bootBar) bootBar.style.width = progress + '%';
          if (bootNum) bootNum.textContent = progress < 10 ? '0' + progress : progress;
          
          if (bootRing) {
            var currentOffset = maxOffset - (progressRatio * maxOffset);
            bootRing.style.strokeDashoffset = currentOffset;
          }

          if (bootStatus) {
            if (progress < 30) bootStatus.textContent = logs[0];
            else if (progress < 60) bootStatus.textContent = logs[1];
            else if (progress < 88) bootStatus.textContent = logs[2];
            else bootStatus.textContent = logs[3];
          }

          if (progressRatio < 1) {
            requestAnimationFrame(updateBoot);
          } else {
            setTimeout(function() {
              bootScreen.classList.add('boot-exit');
              setTimeout(function() {
                if (bootScreen.parentNode) {
                  bootScreen.parentNode.removeChild(bootScreen);
                }
              }, 650);
            }, 200);
          }
        }

        requestAnimationFrame(updateBoot);
      })();
    </script>
  </body>
